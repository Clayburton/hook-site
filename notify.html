<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get notified</title>
<meta name="robots" content="noindex">
<!-- Hook signup page. The "Notify me" buttons open it TWO ways: as its own tab, and (via the
     WordPress host block's go()) swapped into the Hook page's auto-growing iframe. It handles both.
     Standalone: centered on the viewport; MailPoet's auto-resize posts to window.top (this page),
     so the form sizes itself. Embedded: window.top is the WordPress page, so MailPoet's resize
     never reaches us, and 100vh equals the outer frame's leftover height (~13000px), which used to
     leave the form centered thousands of px down in blank paper (the "broken" page). Embedded mode
     therefore top-aligns the content, keeps the small form at its default height, tells the Hook
     block our real height so the outer frame shrinks to fit, clears the leftover walkthrough phone,
     and sends the back link to the top window. The MailPoet form (id 2) is a single email field. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6EFE4; --panel:#EADCC6; --line:#D9C5A6;
    --ink:#2A2724; --ink-soft:#6f6053; --coral:#F04E3C;
    --serif:"Iowan Old Style","Source Serif 4",Georgia,serif;
    --sans:"Nunito",ui-rounded,system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); }
  body{
    font-family:var(--sans);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  .wrap{ width:100%; max-width:440px; text-align:center; }
  .mark{ display:inline-flex; align-items:center; gap:9px; margin-bottom:24px; }
  .mark .rec{ width:15px; height:15px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 4px rgba(240,78,60,.16); }
  .wordmark{ height:30px; width:auto; display:block; overflow:visible; color:#41333E; }
  .wordmark .s{ fill:none; stroke:currentColor; stroke-width:26; stroke-linecap:round; stroke-linejoin:round; }
  .wordmark .play{ fill:none; stroke:var(--coral); stroke-width:26; stroke-linecap:round; stroke-dasharray:82 918; animation:wmplay 4.8s linear infinite; }
  @keyframes wmplay{ to{ stroke-dashoffset:-1000; } }
  @media (prefers-reduced-motion: reduce){ .wordmark .play{ animation:none; } }
  h1{ font-family:var(--serif); font-weight:600; font-size:clamp(1.55rem,6vw,2rem); line-height:1.1; margin:0 0 .6rem; }
  .sub{ font-family:var(--serif); color:var(--ink-soft); font-size:1.02rem; line-height:1.5; margin:0 auto 1.5rem; max-width:30em; }
  .formcard{ border-radius:12px; overflow:hidden; }
  iframe{ width:100%; border:0; display:block; height:150px; background:var(--paper); }
  .fine{ color:var(--ink-soft); font-size:.86rem; line-height:1.5; margin:1.2rem auto 0; max-width:30em; }
  .back{ display:inline-block; margin-top:1.5rem; color:var(--ink-soft); font-size:.9rem; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px; }
  .back:hover{ color:var(--ink); border-color:var(--ink-soft); }

  /* embedded inside the Hook iframe: content sets the height, not the (huge) outer frame */
  html.embedded body{ min-height:0; display:block; padding:112px 20px 64px; }
  html.embedded .wrap{ margin:0 auto; }
  .brandtext{ font-family:var(--serif); font-weight:600; font-size:1.7rem; letter-spacing:-.01em; color:#41333E; }
</style>
</head>
<body>
  <main class="wrap">
    <span class="mark"><b class="brandtext">Songwriting</b></span>
    <h1>Be the first to play it.</h1>
    <p class="sub">Leave your email and we&rsquo;ll tell you the day it goes live &mdash; and, now and then, something else we&rsquo;ve made.</p>
    <div class="formcard">
      <iframe id="mpf" title="Get notified when Songwriting launches" scrolling="no" loading="eager"></iframe>
    </div>
    <p class="fine">We keep it rare &middot; Unsubscribe anytime.</p>
    <a class="back" href="https://clayandkelsy.com/songwriting/" target="_top">&larr; Back to Songwriting</a>
  </main>
  <script>
    (function(){
      var ORIGIN = "https://clayandkelsy.com";
      var EMBEDDED = window.self !== window.top;   /* swapped into the Hook iframe by go() */
      var f = document.getElementById("mpf");
      /* fresh form + token every visit */
      f.src = ORIGIN + "/?mailpoet_form_iframe=2&t=" + Date.now();

      /* standalone (top-level tab): MailPoet's resize posts to window.top = us, so fit the form */
      window.addEventListener("message", function(e){
        if (e.origin !== ORIGIN) return;
        var d = e.data;
        if (typeof d === "string") { try { d = JSON.parse(d); } catch (err) { return; } }
        if (!d) return;
        var h = d.MailPoetIframeHeight;
        if (h && !isNaN(h)) { f.style.height = Math.round(Number(h)) + "px"; postH(); }
      });

      /* embedded: tell the Hook block our real height so the outer frame shrinks to fit (the whole
         point of the fix), and clear the walkthrough phone the frame was drawing for the Hook page */
      function postH(){
        if (!EMBEDDED) return;
        parent.postMessage({ hook: "h", h: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
      }
      if (EMBEDDED) {
        document.documentElement.classList.add("embedded");
        parent.postMessage({ hook: "walk", off: true }, "*");
        parent.postMessage({ hook: "bg", color: "#F6EFE4" }, "*");   /* repaint host page to paper */
        window.addEventListener("load", postH);
        window.addEventListener("resize", postH);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(postH);
        [150, 500, 1200].forEach(function(t){ setTimeout(postH, t); });
        postH();
      }
    })();
  </script>
</body>
</html>
