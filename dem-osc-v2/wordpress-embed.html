<!-- ============================================================
     DEM-OSC — WordPress embed for clayandkelsy.com/dem-osc  (paste this whole file as ONE Custom HTML block)
     What it does:
     · Embeds the DEM-Osc page (GitHub Pages) full-bleed in an iframe that grows to fit its content,
       so there is exactly one scrollbar on the page: this one.
     · Draws DEM-Osc's menu bar HERE, fixed to the browser window, so they
       follow the scroll with zero lag. (A menu bar inside the iframe can only follow a frame late, which reads as jitter.)
       It appears the moment the C&K header scrolls away and hides while the header is on screen.
     · Tells the page where the viewport is on every scroll (its effects follow it), paints this
       page the same colour as the page's theme, and routes menu clicks down into the page.
     · Smooth, inertial scrolling on desktop (Lenis) — the last <script>; safe to delete if it
       ever misbehaves.
     · Hides the WordPress theme's own footer (#colophon) on this page only.
     Message contract with the page (app.js): page→here {hook:"h",h} {hook:"bg",color} {hook:"go",href};
     here→page {hookHost:"vp",top,vh,nav:true} {hookHost:"go",id}.
     ============================================================ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Nunito:wght@700;800&display=swap">
<style>
#colophon{display:none !important}
#hook-nav{position:fixed;top:var(--wp-admin--admin-bar--height,0px);left:0;right:0;z-index:9990;height:64px;display:flex;align-items:center;gap:1.1rem;padding:0 clamp(16px,4vw,40px);box-sizing:border-box;background:rgba(240,232,215,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid #dccfb6;color:#17120c;font-family:Nunito,-apple-system,"Helvetica Neue",Arial,sans-serif;opacity:0;transform:translateY(-8px);will-change:transform,opacity;pointer-events:none;transition:opacity .3s ease,transform .3s ease,background-color .9s ease,color .9s ease,border-color .9s ease}
#hook-nav.show{opacity:1;transform:none;pointer-events:auto}
#hook-nav.dark{background:rgba(21,16,10,.82);border-color:#483525;color:#F3ECDE}
#hook-nav a{color:inherit;text-decoration:none;box-shadow:none;border:0}
#hook-nav .hn-brand{display:inline-flex;align-items:center;gap:.6rem}
#hook-nav .hn-wm{height:26px;width:auto;display:block;overflow:visible;color:#41333E}
#hook-nav.dark .hn-wm{color:#F3ECDE}
#hook-nav .hn-wm .s{fill:none;stroke:currentColor;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
#hook-nav .hn-wm .play{fill:none;stroke:#F04E3C;stroke-width:26;stroke-linecap:round;stroke-dasharray:82 918;animation:hnplay 4.8s linear infinite}
@keyframes hnplay{to{stroke-dashoffset:-1000}}
#hook-nav .hn-name{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:1.1rem;color:#7a3ff2}
#hook-nav .hn-tag{font:400 .74rem "Courier Prime","Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.72}
#hook-nav .hn-links{margin-left:auto;display:flex;gap:1.4rem}
#hook-nav .hn-links a{font-weight:700;font-size:.92rem;opacity:.78}
#hook-nav .hn-links a:hover{opacity:1}
#hook-nav .hn-pill{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:.88rem;color:#f7f3ea;background:#7a3ff2;border-radius:999px;padding:.6em 1.1em;white-space:nowrap}
#hook-nav .hn-pill:hover{background:#6432d0;color:#f7f3ea}
@media (max-width:640px){#hook-nav .hn-links,#hook-nav .hn-tag{display:none}}
@media (prefers-reduced-motion:reduce){#hook-nav{transition:none}#hook-nav .hn-wm .play{animation:none}}
/* the walkthrough phone, drawn here so it sits dead still while the page scrolls under it */
#hook-phone{position:fixed;z-index:9980;display:none;pointer-events:none}
#hook-phone.show{display:block}
#hook-phone .scr{position:relative;aspect-ratio:1100/906;overflow:hidden;border-radius:14px;border:1px solid #dccfb6;background:#f0fcff;box-shadow:0 30px 60px -30px rgba(23,18,12,.55)}
#hook-phone img{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;z-index:0;transition:opacity 0s linear .5s}
#hook-phone img.on{opacity:1;z-index:2;transition:opacity .45s ease}
#hook-phone .hl{position:absolute;z-index:3;border:1.5px solid #3c8ed0;border-radius:10px;box-shadow:0 0 0 4px rgba(60,142,208,.14),0 6px 18px -8px #2f76b0;opacity:0;transition:opacity .5s ease}
#hook-phone .hl.on{opacity:1}
</style>
<div id="hook-nav" aria-label="Hook menu">
  <a class="hn-brand" href="https://clayandkelsy.com/dem-osc/" data-go="#top"><b class="hn-name">DEM-Osc</b><span class="hn-tag">The Osc Collection · free</span></a>
  <nav class="hn-links" aria-label="Sections"><a href="https://clayandkelsy.com/dem-osc/#hear" data-go="#hear">Hear it</a><a href="https://clayandkelsy.com/dem-osc/#inside" data-go="#inside">Inside</a><a href="https://clayandkelsy.com/dem-osc/#faq" data-go="#faq">Questions</a></nav>
  <a class="hn-pill" href="https://clayandkelsy.com/checkout/?add-to-cart=6322&amp;quantity=1">Get it free</a>
</div>
<div id="hook-phone" aria-hidden="true"><div class="scr"></div></div>
<div id="hook-embed" style="margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:100vw;">
  <iframe id="hook-frame"
    src="https://clayburton.github.io/demosc/dem-osc/"
    title="DEM-Osc — free synth for Mac (VST3 and AU)"
    style="display:block;width:100%;border:0;height:12000px;background:#f0e8d7;"
    scrolling="no"
    allow="autoplay"
    loading="eager"></iframe>
</div>
<script>
(function () {
  var ORIGIN = "https://clayburton.github.io";
  var frame = document.getElementById("hook-frame"), nav = document.getElementById("hook-nav");
  var phone = document.getElementById("hook-phone"), scr = phone.querySelector(".scr"), walk = null, step = 0;
  function buildPhone(w) {
    scr.innerHTML = "";
    Object.keys(w.steps).forEach(function (k) {
      var st = w.steps[k], variants = st.src ? [["", st]] : [["light", st.light], ["dark", st.dark]];
      variants.forEach(function (v) {
        if (!v[1]) return;
        var el = document.createElement("img"); el.src = v[1].src; el.alt = ""; el.className = v[0] + (String(step) === k ? " on" : "");
        el.dataset.step = k; if (v[1].focus) el.style.objectPosition = "50% " + v[1].focus; scr.appendChild(el);
      });
      if (w.hl) { var q = w.hl[k]; if (q) { var box = document.createElement("i"); box.className = "hl" + (String(step) === k ? " on" : ""); box.dataset.step = k; box.style.left = q.x; box.style.top = q.y; box.style.width = q.w; box.style.height = q.h; scr.appendChild(box); } }
    });
  }
  function placePhone(r) {
    if (!walk) return;
    var vh = window.innerHeight, margin = walk.navH + vh * (walk.marginFrac || 0.05), ph = walk.width / walk.aspect;
    var secTop = r.top + walk.top, secBottom = r.top + walk.bottom;
    var on = (vh > secTop) ? (secBottom > 0) : false;   /* no less-than sign and no double-ampersand on this line: WordPress mangles tag-shaped text inside a block */
    phone.classList.toggle("show", on); if (!on) return;
    var y = Math.max(secTop, Math.min(margin, secBottom - ph));   /* exactly what position:sticky would do */
    phone.style.left = (r.left + walk.left) + "px"; phone.style.width = walk.width + "px"; phone.style.top = y + "px";
  }
  /* load the page fresh every visit — defeats the iframe-document cache that once served a stale copy */
  frame.src = ORIGIN + "/demosc/dem-osc/?v=" + Date.now();
  var lastH = 0;
  function go(href) { window.scrollTo(0, 0); frame.src = ORIGIN + "/demosc/dem-osc/" + href + "?v=" + Date.now(); }
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || !e.data) return;
    /* auto-grow: the page posts its content height; the 8px guard stops resize loops */
    if (e.data.hook === "h" && typeof e.data.h === "number") { var h = Math.round(e.data.h); if (Math.abs(h - lastH) > 8) { lastH = h; frame.style.height = h + "px"; } }
    /* theme sync: paint this page the same colour as the page inside, and switch the menu bar */
    if (e.data.hook === "bg" && /^#[0-9a-fA-F]{6}$/.test(e.data.color || "")) {
      frame.style.background = e.data.color;
      document.documentElement.style.setProperty("background-color", e.data.color, "important");
      document.body.style.setProperty("background-color", e.data.color, "important");
    }
    /* the page asks to open one of its own pages (Notify me): scroll up first, then swap the frame */
    if (e.data.hook === "go" && typeof e.data.href === "string" && /^[a-z0-9-]+\.html$/.test(e.data.href)) go(e.data.href);
    /* the page reports a download tap; hand it to Google Tag Manager as an event */
    if (e.data.hook === "event" && typeof e.data.name === "string" && /^[a-z_]+$/.test(e.data.name)) { window.dataLayer = window.dataLayer || []; window.dataLayer.push({ event: e.data.name }); }
    if (e.data.hook === "walk") { walk = e.data.off ? null : e.data; if (walk) { buildPhone(walk); placePhone(frame.getBoundingClientRect()); } else phone.classList.remove("show"); }
    if (e.data.hook === "step" && typeof e.data.n === "number") { step = e.data.n; scr.querySelectorAll("[data-step]").forEach(function (im) { im.classList.toggle("on", im.dataset.step === String(step)); }); }
  });
  /* tell the page where the viewport is, and show our menu bar once the C&K header has scrolled away */
  var queued = false;
  function postViewport() {
    queued = false; if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect();
    nav.classList.toggle("show", r.top < -10);
    placePhone(r);
    frame.contentWindow.postMessage({ hookHost: "vp", top: r.top, vh: window.innerHeight, nav: true, phone: true }, ORIGIN);
  }
  window.addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(postViewport); } }, { passive: true });
  window.addEventListener("resize", postViewport);
  frame.addEventListener("load", postViewport);
  postViewport();
  /* menu clicks: sections glide inside the page (it scrolls this window); the brand goes to the top */
  nav.querySelectorAll("[data-go]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (a.getAttribute("data-go") === "#top") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      frame.contentWindow.postMessage({ hookHost: "go", id: a.getAttribute("data-go") }, ORIGIN);
    });
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
<script>
(function () {  /* smooth, inertial scrolling on desktop only — delete this block if it ever misbehaves */
  if (!window.Lenis || !matchMedia("(pointer: fine)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var lenis = new Lenis({ lerp: 0.085, smoothWheel: true });
  function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
})();
</script>
