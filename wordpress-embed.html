<!-- ============================================================
     Hook — full-bleed embed for clayandkelsy.com/hook/
     Paste this WHOLE file into ONE "Custom HTML" block on the page.
     The page needs nothing else. The iframe grows to fit its content,
     and the light/dark toggle inside also repaints the WordPress page
     behind it so the frame is invisible.

     The iframe has NO hardcoded src — the script sets it with a per-load
     ?v=<timestamp> so the Hook site loads FRESH on every visit. Without
     that, the browser cached the iframe's document and kept showing an old
     copy of the Hook site after we deployed changes (this is what made the
     signup form look broken — a stale cached render, not the live version).
     Only the tiny index.html is re-fetched; the heavy assets (CSS/JS/images)
     still cache via their own ?v= URLs, so the freshness costs ~nothing.

     The style below hides the WordPress THEME's own footer (#colophon)
     on this page only — it is 1,124 px of site-menu links that sat under
     the embed and, painted over by the background sync, read as a huge
     blank space below Hook's own footer. Hook's page brings its own
     footer; the theme's is redundant here. (Scoped: this block only
     exists on /hook/, so no other page loses its footer.)
     ============================================================ -->
<style>#colophon{display:none !important}</style>
<div id="hook-embed" style="margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:100vw;">
  <iframe id="hook-frame"
    title="Hook — a songwriter's looper for iPhone"
    style="display:block;width:100%;border:0;height:12000px;background:#F6EFE4;"
    scrolling="no"
    allow="autoplay"
    loading="eager"></iframe>
</div>
<script>
(function () {
  var ORIGIN = "https://clayburton.github.io";
  var frame = document.getElementById("hook-frame");
  /* Load the Hook site fresh every visit — defeats the iframe-document cache that
     was serving a stale copy of the site (see note at top of this block). */
  frame.src = ORIGIN + "/hook-site/?v=" + Date.now();
  var lastH = 0;
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || !e.data) return;
    /* auto-grow: the page posts its content height; 8px guard stops resize loops */
    if (e.data.hook === "h" && typeof e.data.h === "number") {
      var h = Math.round(e.data.h);
      if (Math.abs(h - lastH) > 8) { lastH = h; frame.style.height = h + "px"; }
    }
    /* theme sync: paint the WP page the same paper color as the page inside */
    if (e.data.hook === "bg" && /^#[0-9a-fA-F]{6}$/.test(e.data.color || "")) {
      frame.style.background = e.data.color;
      document.documentElement.style.setProperty("background-color", e.data.color, "important");
      document.body.style.setProperty("background-color", e.data.color, "important");
    }
  });
  /* tell the page where the viewport is, so its theme button can follow the scroll */
  var queued = false;
  function postViewport() {
    queued = false;
    if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect();
    frame.contentWindow.postMessage({ hookHost: "vp", top: r.top, vh: window.innerHeight }, ORIGIN);
  }
  window.addEventListener("scroll", function () {
    if (!queued) { queued = true; requestAnimationFrame(postViewport); }
  }, { passive: true });
  window.addEventListener("resize", postViewport);
  frame.addEventListener("load", postViewport);
  postViewport();
})();
</script>
