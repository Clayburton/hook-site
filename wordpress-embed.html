<!-- ============================================================
     SONGWRITING — WordPress embed for clayandkelsy.com/songwriting  (paste this whole file as ONE Custom HTML block)
     What it does:
     · Embeds the Songwriting page (GitHub Pages) full-bleed in an iframe that grows to fit its
       content, so there is exactly one scrollbar on the page: this one.
     · Draws the product menu bar HERE, fixed to the browser window, so it follows the scroll with
       zero lag. It appears the moment the C&K global header scrolls away and hides while it is on screen.
     · Tells the page where the viewport is on every scroll, paints this page the same colour as the
       page's theme, routes menu clicks (and the theme control) down into the page.
     · Smooth, inertial scrolling on desktop (Lenis) — the last <script>; safe to delete if it misbehaves.
     · Hides the WordPress theme's own footer (#colophon) on this page only.
     Message contract with the page (app.js): page then here {hook:"h",h} {hook:"bg",color} {hook:"go",href};
     here then page {hookHost:"vp",top,vh,nav:true} {hookHost:"go",id} {hookHost:"theme"}.
     ============================================================ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
#colophon{display:none !important}
#hook-nav{position:fixed;top:var(--wp-admin--admin-bar--height,0px);left:0;right:0;z-index:9990;height:64px;display:flex;align-items:center;gap:22px;padding:0 clamp(16px,4vw,40px);box-sizing:border-box;background:rgba(245,239,227,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid #d8cfbe;color:#302e29;font-family:Nunito,-apple-system,"Helvetica Neue",Arial,sans-serif;opacity:0;transform:translateY(-8px);will-change:transform,opacity;pointer-events:none;transition:opacity .3s ease,transform .3s ease,background-color .4s ease,color .4s ease,border-color .4s ease}
#hook-nav.show{opacity:1;transform:none;pointer-events:auto}
#hook-nav.dark{background:rgba(33,31,28,.86);border-color:#4b443b;color:#f2e8d7}
#hook-nav a,#hook-nav button{color:inherit;text-decoration:none;box-shadow:none;border:0;background:none;font:inherit}
#hook-nav .hn-brand{display:inline-flex;align-items:center;gap:11px}
#hook-nav .hn-mark{height:30px;width:auto;display:block}
#hook-nav .hn-name{font-family:"Source Serif 4",Georgia,serif;font-size:22px;line-height:1.02;letter-spacing:-.02em}
#hook-nav .hn-name small{display:block;margin-top:2px;font-family:Nunito,sans-serif;font-size:11px;font-style:italic;letter-spacing:0;color:#716c60}
#hook-nav.dark .hn-name small{color:#bdb4a4}
#hook-nav .hn-links{margin-left:auto;display:flex;gap:30px}
#hook-nav .hn-links a{font-weight:700;font-size:13px;opacity:.82}
#hook-nav .hn-links a:hover{opacity:1;color:#ca4d37}
#hook-nav.dark .hn-links a:hover{color:#f28c72}
#hook-nav .hn-theme{cursor:pointer;font-size:20px;line-height:1;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;opacity:.85}
#hook-nav .hn-theme:hover{opacity:1}
#hook-nav .hn-pill{cursor:pointer;font-weight:800;font-size:13px;color:#fff9f1;background:#ca4d37;border-radius:4px;padding:.72em 1.15em;white-space:nowrap;transition:transform .2s ease}
#hook-nav .hn-pill:hover{transform:translateY(-1px)}
#hook-nav.dark .hn-pill{background:#f28c72;color:#211f1c}
@media (max-width:640px){#hook-nav .hn-links,#hook-nav .hn-name small{display:none}}
@media (prefers-reduced-motion:reduce){#hook-nav{transition:none}#hook-nav .hn-pill{transition:none}}
</style>
<div id="hook-nav" aria-label="Songwriting menu">
  <a class="hn-brand" href="https://clayandkelsy.com/songwriting/" data-go="#top"><img class="hn-mark" src="https://clayburton.github.io/hook-site/assets/songwriting-mark.webp?v=20260916" alt="" width="168" height="176"><span class="hn-name">Songwriting<small>by Clay and Kelsy</small></span></a>
  <nav class="hn-links" aria-label="Sections"><a href="https://clayandkelsy.com/songwriting/#loop" data-go="#loop">The feel</a><a href="https://clayandkelsy.com/songwriting/#words" data-go="#words">The words</a><a href="https://clayandkelsy.com/songwriting/#pricing" data-go="#pricing">The price</a></nav>
  <button class="hn-theme" type="button" aria-label="Toggle dark mode" aria-pressed="false">&#9680;</button>
  <a class="hn-pill" href="https://clayburton.github.io/hook-site/notify.html">Notify me</a>
</div>
<div id="hook-embed" style="margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:100vw;">
  <iframe id="hook-frame"
    src="https://clayburton.github.io/hook-site/"
    title="Songwriting by Clay and Kelsy"
    style="display:block;width:100%;border:0;height:12000px;background:#f5efe3;"
    scrolling="no"
    allow="autoplay"
    loading="eager"></iframe>
</div>
<script>
(function () {
  var ORIGIN = "https://clayburton.github.io";
  var frame = document.getElementById("hook-frame"), nav = document.getElementById("hook-nav");
  var themeBtn = nav.querySelector(".hn-theme");
  /* load the page fresh every visit — defeats the iframe-document cache that once served a stale copy */
  frame.src = ORIGIN + "/hook-site/?v=" + Date.now();
  var lastH = 0;
  function go(href) { window.scrollTo(0, 0); frame.src = ORIGIN + "/hook-site/" + href + "?v=" + Date.now(); }
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || !e.data) return;
    /* auto-grow: the page posts its content height; the 8px guard stops resize loops */
    if (e.data.hook === "h" && typeof e.data.h === "number") { var h = Math.round(e.data.h); if (Math.abs(h - lastH) > 8) { lastH = h; frame.style.height = h + "px"; } }
    /* theme sync: paint this page the same colour as the page inside, and switch the menu bar */
    if (e.data.hook === "bg" && /^#[0-9a-fA-F]{6}$/.test(e.data.color || "")) {
      frame.style.background = e.data.color;
      document.documentElement.style.setProperty("background-color", e.data.color, "important");
      document.body.style.setProperty("background-color", e.data.color, "important");
      var dark = e.data.color.toLowerCase() === "#211f1c";
      nav.classList.toggle("dark", dark);
      themeBtn.setAttribute("aria-pressed", String(dark));
      themeBtn.setAttribute("aria-label", dark ? "Turn on light mode" : "Turn on dark mode");
    }
    /* the page asks to open one of its own pages (Notify me): scroll up first, then swap the frame */
    if (e.data.hook === "go" && typeof e.data.href === "string" && /^[a-z0-9-]+\.html$/.test(e.data.href)) go(e.data.href);
    /* section navigation: the frame never scrolls itself, so the page hands us the target's Y inside
       the document and we scroll this window to it, landing below the fixed bar */
    if (e.data.hook === "scrollto" && typeof e.data.y === "number") {
      var NAVH = 80, base = frame.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0);
      window.scrollTo({ top: Math.max(0, Math.round(base + e.data.y - NAVH)), behavior: "smooth" });
    }
  });
  /* tell the page where the viewport is, and show our menu bar once the C&K header has scrolled away */
  var queued = false;
  function postViewport() {
    queued = false; if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect();
    nav.classList.toggle("show", r.top < -10);
    frame.contentWindow.postMessage({ hookHost: "vp", top: r.top, vh: window.innerHeight, nav: true }, ORIGIN);
  }
  window.addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(postViewport); } }, { passive: true });
  window.addEventListener("resize", postViewport);
  frame.addEventListener("load", postViewport);
  postViewport();
  /* menu clicks: sections glide inside the page (it scrolls this window); the brand goes to the top */
  nav.querySelectorAll("[data-go]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (a.getAttribute("data-go") === "#top") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      frame.contentWindow.postMessage({ hookHost: "go", id: a.getAttribute("data-go") }, ORIGIN);
    });
  });
  /* theme control: the page owns the theme; we just ask it to toggle and reflect the result via {hook:"bg"} */
  themeBtn.addEventListener("click", function () { if (frame.contentWindow) frame.contentWindow.postMessage({ hookHost: "theme" }, ORIGIN); });
  nav.querySelector(".hn-pill").addEventListener("click", function (e) { e.preventDefault(); go("notify.html"); });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
<script>
(function () {  /* smooth, inertial scrolling on desktop only — delete this block if it ever misbehaves */
  if (!window.Lenis || !matchMedia("(pointer: fine)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var lenis = new Lenis({ lerp: 0.085, smoothWheel: true });
  function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
})();
</script>
