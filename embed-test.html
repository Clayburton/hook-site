<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>embed harness</title>
<style>body{margin:0;font-family:-apple-system,sans-serif} .ckhead{height:84px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:center;gap:2rem;font-family:monospace;font-size:15px;color:#222} .ckfoot{height:300px;background:#eee}</style>
</head><body>
<div class="ckhead">C&amp;K &nbsp; [Instruments] [C&amp;K Music] [Designs] [About] [Contact]</div>
<!-- ============================================================
     Hook — full-bleed embed for clayandkelsy.com/hook/
     Paste this WHOLE file into ONE "Custom HTML" block on the page.
     The page needs nothing else.

     What it does:
     · Loads the Hook site fresh on every visit (?v=<timestamp>) so you always
       see the latest version — no cached copies.
     · Grows the frame to fit Hook's content (Hook posts its height).
     · Paints the WordPress page the same color as the page inside (Hook
       posts its theme color when it dips to dark), so the frame is invisible.
     · Posts the viewport position to Hook on every scroll — that is how the
       Hook menu bar knows to stay hidden while the C&K menu bar is on screen
       and to pin to the top the moment it scrolls away, and how the page's
       reveals and nightfall follow your scroll.
     · Smooth, inertial scrolling for the whole page on desktop (Lenis), for
       that premium feel. Touch devices keep native scrolling. If it ever
       misbehaves with the theme, delete the "smooth feel" block at the bottom
       and everything else keeps working.

     The style hides the WordPress THEME's own footer (#colophon) on this page
     only — Hook brings its own footer. (Scoped: this block only exists on /hook/.)
     ============================================================ -->
<style>#colophon{display:none !important}</style>
<div id="hook-embed" style="margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:100vw;">
  <iframe id="hook-frame"
    title="Hook — a writer's looper for iPhone"
    style="display:block;width:100%;border:0;height:12000px;background:#F6EFE4;"
    scrolling="no"
    allow="autoplay"
    loading="eager"></iframe>
</div>
<script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
<script>
(function () {
  var ORIGIN = location.origin;
  var frame = document.getElementById("hook-frame");
  /* fresh every visit — defeats the iframe-document cache that used to serve stale copies */
  frame.src = ORIGIN + (new URLSearchParams(location.search).get("src") || "/v2/") + "?v=" + Date.now();
  var lastH = 0;
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || !e.data) return;
    /* auto-grow: the page posts its content height; 8px guard stops resize loops */
    if (e.data.hook === "h" && typeof e.data.h === "number") {
      var h = Math.round(e.data.h);
      if (Math.abs(h - lastH) > 8) { lastH = h; frame.style.height = h + "px"; }
    }
    /* theme sync: paint the WP page the same color as the page inside */
    if (e.data.hook === "bg" && /^#[0-9a-fA-F]{6}$/.test(e.data.color || "")) {
      frame.style.background = e.data.color;
      document.documentElement.style.setProperty("background-color", e.data.color, "important");
      document.body.style.setProperty("background-color", e.data.color, "important");
    }
  });
  /* tell Hook where the viewport is, on every scroll (rAF-throttled) */
  var queued = false;
  function postViewport() {
    queued = false;
    if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect();
    frame.contentWindow.postMessage({ hookHost: "vp", top: r.top, vh: window.innerHeight }, ORIGIN);
  }
  window.addEventListener("scroll", function () {
    if (!queued) { queued = true; requestAnimationFrame(postViewport); }
  }, { passive: true });
  window.addEventListener("resize", postViewport);
  frame.addEventListener("load", postViewport);
  postViewport();
  /* the smooth feel: inertial scrolling for the whole page — desktop only, and never for
     people who asked for reduced motion. Safe to delete this block if it ever misbehaves. */
  try {
    var fine = window.matchMedia("(pointer: fine)").matches;
    var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (window.Lenis && fine && !still) {
      var lenis = new Lenis({ lerp: 0.085, smoothWheel: true });
      (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
    }
  } catch (err) {}
})();
</script>

</body></html>
